name: test

on:
  push:
    branches: [ "release", "develop" ]
    paths-ignore: [ "**.md" ]
  pull_request:
    branches: [ "release", "develop" ]
    paths-ignore: [ "**.md" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true        # abort older queued/running copies

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # ── axis 1 ───────────────────────────────
        libBuildType: [ core, korlibs, kotlinx, okio ]

        # ── axis 2 plus per-target data ─────────
        target: [ android, apple, js, desktop-ubuntu, desktop-mac, windows, linux, wasmJs ]
        
        # ── axis 3 - Java version ─────────────────
        java-version: [ "17", "21", "24" ]

        include:
          # android ----------------------------------------------------------
          - target: android
            os: ubuntu-latest
            tasks: testDebugUnitTest testReleaseUnitTest
            continueOnError: false

          # apple ------------------------------------------------------------
          - target: apple
            os: macos-latest
            tasks: iosX64Test iosSimulatorArm64Test macosX64Test macosArm64Test tvosX64Test tvosSimulatorArm64Test
            continueOnError: false

          # js ---------------------------------------------------------------
          - target: js
            os: ubuntu-latest
            tasks: jsTest
            continueOnError: false

          # desktop-ubuntu ----------------------------------------------------------
          - target: desktop-ubuntu
            os: ubuntu-latest
            tasks: jvmTest
            continueOnError: false

          # desktop-mac ----------------------------------------------------------
          - target: desktop-mac
            os: macos-latest
            tasks: jvmTest
            continueOnError: false

          # windows ----------------------------------------------------------
          - target: windows
            os: windows-latest
            tasks: mingwX64Test
            continueOnError: false

          # linux ------------------------------------------------------------
          - target: linux
            os: ubuntu-latest
            tasks: linuxX64Test
            continueOnError: false

          # wasmJs -----------------------------------------------------------
          - target: wasmJs
            os: ubuntu-latest
            tasks: wasmJsNodeTest          # <- only Node test task
            continueOnError: false

        # ── forbid the unwanted pairs ─────
        exclude:
          - target: wasmJs
            libBuildType: korlibs

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target }} – ${{ matrix.libBuildType }} (Java ${{ matrix.java-version }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - uses: gradle/actions/setup-gradle@v4
        name: Set up Gradle

      - name: Run tests for ${{ matrix.libBuildType }} on ${{ matrix.target }}
        continue-on-error: ${{ matrix.continueOnError }}
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./gradlew mingwX64Test -PlibBuildType=${{ matrix.libBuildType }}
          else
            chmod +x ./runTests.sh
            ./runTests.sh "${{ matrix.libBuildType }}" "${{ matrix.tasks }}"
          fi
        shell: bash
        working-directory: ${{ github.workspace }}

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.target }}-${{ matrix.libBuildType }}-java${{ matrix.java-version }}
          path: ksoup-test/build/reports/tests/**/*